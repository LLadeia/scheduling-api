[project]
name = "scheduling-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["integration: requires dedicated real PostgreSQL database"]
[tool.coverage.run]
source = ["app"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 80
