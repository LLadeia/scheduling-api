services:
  test-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: scheduling_test
      POSTGRES_PASSWORD: test_only_not_production
      POSTGRES_DB: scheduling_test
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U scheduling_test -d scheduling_test]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
  tests:
    build: {context: ., target: dev}
    environment:
      DATABASE_URL: postgresql+asyncpg://scheduling_test:test_only_not_production@test-db:5432/scheduling_test
      TEST_DATABASE_URL: postgresql+asyncpg://scheduling_test:test_only_not_production@test-db:5432/scheduling_test
      JWT_SECRET: test-only-secret-at-least-32-characters-long
    command: [sh, -c, "alembic upgrade head && pytest --cov=app --cov-report=term-missing --cov-fail-under=80"]
    networks: [test]
    depends_on:
      test-db: {condition: service_healthy}
networks:
  test: {}
