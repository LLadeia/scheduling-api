services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    command: [alembic, upgrade, head]
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        VITE_AVAILABILITY_MAX_DAYS: ${AVAILABILITY_MAX_DAYS:-31}
    ports: ["127.0.0.1:3000:80"]
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
networks:
  backend: {}
volumes:
  postgres_data: {}
